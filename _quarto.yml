project:
  type: book
  output-dir: docs

lang: it

book:
  title: "Analisi esplorativa dei dati in psicologia"
  subtitle: "Modulo introduttivo"

  author:
    - name: "Corrado Caudek"
      orcid: "0000-0002-1404-0420"

  date: last-modified
  date-format: "DD MMMM YYYY"

  license: "CC BY-NC-ND"
  favicon: style/gauss.png

  site-url: https://ccaudek.github.io/utet-eda/
  repo-url: https://github.com/ccaudek/utet-eda/
  repo-actions: [source, issue]

  reader-mode: true
  page-navigation: true
  back-to-top-navigation: true

  search:
    location: sidebar
    type: overlay
    copy-button: true
    show-item-context: true

  sidebar:
    collapse-level: 1

  google-analytics:
    tracking-id: "G-QT5S3P9D31"
    anonymize-ip: true

  cookie-consent:
    type: express
    style: headline
    palette: light
    language: it
    prefs-text: "Preferenze cookie"

  open-graph: true
  twitter-card: true

  page-footer:
    left: |
      **Analisi esplorativa dei dati (EDA)** — Modulo del progetto UTET a supporto del manuale *Inferenza bayesiana in psicologia: Ragionare con l'incertezza*.
    right: |
      Realizzato con [Quarto](https://quarto.org/).

  chapters:
    - index.qmd
    - prefazione.qmd

    - part: chapters/key_notions/introduction_key_notions.qmd
      chapters:
        - chapters/key_notions/02_key_notions.qmd
        - chapters/key_notions/03_design.qmd
        - chapters/key_notions/04_measurement.qmd
        - chapters/key_notions/05_cognitive_models.qmd

    - part: chapters/R/introduction_r_lang.qmd
      chapters:
        - chapters/R/01_r_syntax.qmd
        - chapters/R/02_environment.qmd
        - chapters/R/03_utility_functions.qmd
        - chapters/R/04_r_programming.qmd
        - chapters/R/05_dplyr.qmd
        - chapters/R/06_ggplot2.qmd
        - chapters/R/07_quarto.qmd
        - chapters/R/08_r_packages.qmd

    - part: chapters/eda/introduction_eda.qmd
      chapters:
        - chapters/eda/01_project_structure.qmd
        - chapters/eda/02_data_cleaning.qmd
        - chapters/eda/03_exploring_univariate_data.qmd
        - chapters/eda/05_data_visualization_principles.qmd
        - chapters/eda/06_loc_scale.qmd
        - chapters/eda/07_introduction_normal_distribution.qmd
        - chapters/eda/08_correlation.qmd
        - chapters/eda/09_causality_intro.qmd
        - chapters/eda/11_outlier.qmd

    - part: "Epilogo"
      chapters:
        - chapters/epiloque/epiloque.qmd

crossref:
  appendix-title: "Appendice"

bibliography: references.bib
csl: apa.csl
link-citations: true

format:
  html:
    theme:
      light: cosmo
      dark: darkly
    css: style/custom.css

    respect-user-color-scheme: true
    canonical-url: true

    toc: true
    toc-depth: 2
    toc-title: "Sommario"
    toc-expand: 2
    smooth-scroll: true
    anchor-sections: true

    code-fold: false
    code-summary: "Mostra/Nascondi codice"
    code-copy: hover
    code-link: true
    code-overflow: scroll
    code-block-bg: true

    fig-responsive: true
    fig-align: center
    fig-cap-location: bottom
    tbl-cap-location: top
    lightbox: auto
    df-print: paged

    footnotes-hover: true
    citations-hover: true
    crossrefs-hover: true

    link-external-icon: true
    link-external-newwindow: true
    link-external-filter: "^(?:https?:)?//ccaudek\\.github\\.io/utet-eda/"

    html-math-method:
      method: mathjax
      url: "https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"

execute:
  freeze: auto
  echo: true
  warning: false
  message: false
  fig.width: 6
  fig.asp: 0.618
  fig.retina: 2
  fig.align: center
  fig.show: hold
  options:
    width: 120
    pillar.width: Inf
    tibble.width: Inf
