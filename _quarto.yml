project:
  type: book
  output-dir: docs

lang: it

book:
  title: "Analisi esplorativa dei dati in psicologia"
  subtitle: "Modulo introduttivo"

  author:
    - name: "Corrado Caudek"
      orcid: "0000-0002-1404-0420"

  date: last-modified
  date-format: "DD MMMM YYYY"

  license: "CC BY-NC-ND"
  favicon: style/gauss.png

  site-url: https://ccaudek.github.io/utet-eda/
  repo-url: https://github.com/ccaudek/utet-eda/
  repo-actions: [source, issue]

  reader-mode: true
  page-navigation: true
  back-to-top-navigation: true

  search:
    location: sidebar
    type: overlay
    copy-button: true
    show-item-context: true

  sidebar:
    collapse-level: 1

  google-analytics:
    tracking-id: "G-QT5S3P9D31"
    anonymize-ip: true

  cookie-consent:
    type: express
    style: headline
    palette: light
    language: it
    prefs-text: "Preferenze cookie"

  open-graph: true
  twitter-card: true

  page-footer:
    left: |
      **Analisi esplorativa dei dati (EDA)** — Modulo del progetto UTET a supporto del manuale *Inferenza bayesiana in psicologia: Ragionare con l'incertezza*.
    right: |
      Realizzato con [Quarto](https://quarto.org/).

  chapters:
    - index.qmd
    - prefazione.qmd

    - part: chapters/key_notions/introduction_key_notions.qmd
      chapters:
        - chapters/key_notions/02_key_notions.qmd
        - chapters/key_notions/03_design.qmd
        - chapters/key_notions/04_measurement.qmd
        - chapters/key_notions/05_cognitive_models.qmd

    - part: chapters/R/introduction_r_lang.qmd
      chapters:
        - chapters/R/01_r_syntax.qmd
        - chapters/R/02_environment.qmd
        - chapters/R/03_utility_functions.qmd
        - chapters/R/05_dplyr.qmd
        - chapters/R/06_ggplot2.qmd
        # - chapters/R/04_r_programming.qmd
        - chapters/R/07_quarto.qmd
        - chapters/R/08_r_packages.qmd

    - part: chapters/eda/introduction_eda.qmd
      chapters:
        - chapters/eda/01_project_structure.qmd
        - chapters/eda/02_data_cleaning.qmd
        - chapters/eda/03_exploring_univariate_data.qmd
        - chapters/eda/05_data_visualization_principles.qmd
        - chapters/eda/06_loc_scale.qmd
        - chapters/eda/07_introduction_normal_distribution.qmd
        - chapters/eda/08_correlation.qmd
        - chapters/eda/09_causality_intro.qmd
        - chapters/eda/11_outlier.qmd

    - part: "Epilogo"
      chapters:
        - chapters/epiloque/epiloque.qmd

crossref:
  appendix-title: "Appendice"

bibliography: references.bib
csl: apa.csl
link-citations: true

format:
  html:
    highlight-style: arrow

    theme:
      light:
        - cosmo
        - style/custom.scss
      dark:
        - darkly
        - style/custom.scss
        - style/custom-dark.scss

    respect-user-color-scheme: true
    canonical-url: true

    toc: true
    toc-location: right
    toc-depth: 2
    toc-title: "Sommario"
    toc-expand: 2
    smooth-scroll: true
    anchor-sections: true

    code-fold: false
    code-summary: "Mostra/Nascondi codice"
    code-copy: hover
    code-link: true
    code-overflow: wrap
    code-block-bg: true

    fig-responsive: true
    fig-align: center
    fig-cap-location: bottom
    tbl-cap-location: top
    lightbox: auto
    df-print: paged

    footnotes-hover: true
    citations-hover: true
    crossrefs-hover: true

    link-external-icon: true
    link-external-newwindow: true
    link-external-filter: "^(?:https?:)?//ccaudek\\.github\\.io/utet-prob/"

    html-math-method: 
      method: mathjax
      mathjax:
        config: TeX-AMS_CHTML
        options:
          font: "Latin-Modern"


  pdf:
    documentclass: scrbook
    classoption:
      - a4paper
      - 11pt
      - open=any            # i capitoli non iniziano forzatamente a pagina dispari
                            # (evita pagine bianche: sensato per un PDF letto a schermo;
                            # per la stampa tipografica rimuovere questa riga)
    pdf-engine: lualatex    
    mainfont: "Libertinus Serif"   # copertura IAST completa; alternative: "Gentium Plus",
    sansfont: "Libertinus Sans"    # "EB Garamond", "Charis SIL"
    lang: it                # se non è già a livello di progetto: attiva sillabazione
                            # italiana e traduce "Indice", "Capitolo", ecc.
    toc: true
    toc-depth: 2
    number-sections: true

    colorlinks: true
    linkcolor: MidnightBlue    # più sobrio del blu acceso predefinito
    citecolor: MidnightBlue
    urlcolor: MidnightBlue

    geometry:
      - top=25mm
      - bottom=25mm
      - inner=30mm           # con scrbook (twoside) inner/outer è più corretto
      - outer=25mm           # di left/right: il margine interno assorbe la rilegatura

    include-in-header:
      text: |
        \usepackage[automark]{scrlayer-scrpage}  % testatine correnti (capitolo/sezione)
        \clubpenalty=10000                        % niente righe orfane
        \widowpenalty=10000                       % niente righe vedove


execute:
  freeze: auto
  cache: false

  echo: true
  warning: false
  message: false
  error: false

  fig.width: 6.5
  fig.asp: 0.618
  fig.retina: 2
  fig.align: center
  fig.show: hold

  options:
    width: 90
    pillar.width: 90
    tibble.width: 90


